<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dokumentasi Kegiatan & Acara — Elegan Modern</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Konfigurasi Tema Elegan Modern -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#1b1f3a', // Navy Blue
              accent: '#d97706',  // Golden Orange
              soft: '#f9f7f5',    // Soft Cream
              secondary: '#4b5563', // Gray for text
            },
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <style>
      body {
        background-color: #f9f7f5;
      }
      .activity-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .activity-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.1), 0 5px 10px -5px rgba(0, 0, 0, 0.04);
      }
      .image-container {
        height: 200px; /* Tinggi gambar konsisten */
        width: 100%;
        overflow: hidden;
      }
      .image-placeholder {
        object-fit: cover;
        height: 100%;
        width: 100%;
        transition: transform 0.5s ease;
      }
      .activity-card:hover .image-placeholder {
        transform: scale(1.05);
      }
      /* Custom style for the blue progress bar to match the screenshot color */
      .progress-bar-fill {
        background-color: #2563eb; /* Blue-600 for a consistent look */
      }
      .progress-text {
        color: #2563eb; /* Blue-600 */
      }
    </style>
  </head>
  <body class="min-h-screen font-sans bg-soft text-primary antialiased selection:bg-accent selection:text-white">
    
    <!-- Header Navigasi -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100">
      <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <!-- Brand / Judul -->
        <div class="flex items-center gap-3">
          <div>
            <h1 class="font-bold text-lg leading-tight text-primary">Dokumentasi Kegiatan</h1>
            <p class="text-xs text-gray-500">Arsip Publik</p>
          </div>
        </div>
        <!-- Tombol Aksi (Filter/Search Mock) -->
        <button class="text-sm font-medium text-gray-500 hover:text-accent transition-colors flex items-center gap-2 border border-gray-200 p-2 rounded-lg hover:border-accent">
          <i data-lucide="filter" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Filter Kategori</span>
        </button>
      </div>
    </header>

    <!-- Kontainer Utama -->
    <div id="app-container" class="p-4 sm:p-8 max-w-6xl mx-auto">
      
      <!-- Judul Halaman -->
      <div class="mb-12 text-center max-w-3xl mx-auto mt-4">
        <span class="inline-block py-1 px-3 rounded-full bg-blue-100 text-blue-700 text-xs font-bold tracking-wider mb-4 uppercase">Arsip Kegiatan Tahun 2025</span>
        <h2 class="text-3xl md:text-4xl font-bold text-primary mb-4 leading-tight">
          Sorotan Aktivitas dan Capaian
        </h2>
        <p class="text-secondary text-lg">
          Kumpulan dokumentasi visual dan naratif dari berbagai kegiatan operasional, pertemuan, dan kunjungan lapangan.
        </p>
      </div>

      <!-- Grid Dokumentasi Kegiatan -->
      <div
        id="activities-grid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"
      >
        <!-- Activity Cards will be rendered here by JavaScript -->
        <div class="col-span-full text-center py-20 text-gray-400 animate-pulse">
          Memuat data kegiatan...
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center text-xs text-gray-400 pt-12 mt-12 border-t border-gray-200">
        <p>© 2025 Arsip Digital Kegiatan. Diperbarui setiap bulan.</p>
      </div>
    </div>

    <script>
      // Data Mock Kegiatan. Properti 'progress' ditambahkan untuk Realisasi Fisik.
      const ACTIVITY_DATA = [
        {
          id: "A001",
          title: "Peresmian Infrastruktur Digital Fase I",
          date: "20 September 2025",
          location: "Balai Kota",
          category: "Inaugurasi",
          summary:
            "Acara peresmian jaringan serat optik desa dan peluncuran layanan e-government terpadu.",
          // GAMBAR BARU UNTUK PEMBANGUNAN (KONSTRUKSI)
          imageUrl:
            "https://images.unsplash.com/photo-1596541223130-5d31a733b8de?q=80&w=600&auto=format&fit=crop", 
          detailUrl: "#detail-A001",
          progress: 85 // Realisasi Fisik
        },
        {
          id: "A002",
          title: "Rapat Koordinasi Evaluasi Proyek",
          date: "15 Agustus 2025",
          location: "Ruang Rapat Utama",
          category: "Rapat Internal",
          summary:
            "Evaluasi capaian triwulan ketiga dan pembahasan strategi percepatan proyek yang tertunda.",
          imageUrl:
            "https://images.unsplash.com/photo-1552664730-d307ca884978?q=80&w=600&auto=format&fit=crop",
          detailUrl: "#detail-A002",
          progress: 75 // Realisasi Fisik
        },
        {
          id: "A003",
          title: "Kunjungan Lapangan Jembatan Citarum",
          date: "01 Juli 2025",
          location: "Lokasi Proyek Jembatan",
          category: "Kunjungan",
          summary:
            "Inspeksi mendalam kondisi jembatan layang yang baru selesai dan penyerahan berita acara.",
          imageUrl:
            "https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=600&auto=format&fit=crop",
          detailUrl: "#detail-A003",
          progress: 95 // Realisasi Fisik
        },
        {
          id: "A004",
          title: "Pelatihan Peningkatan Kapasitas SDM",
          date: "10 Juni 2025",
          location: "Pusat Pelatihan",
          category: "Pelatihan",
          summary:
            "Workshop mengenai implementasi standar ISO 9001 untuk seluruh staf teknis dan manajerial.",
          imageUrl:
            "https://images.unsplash.com/photo-1541746972966-293674d82531?q=80&w=600&auto=format&fit=crop",
          detailUrl: "#detail-A004",
          progress: 100 // Realisasi Fisik
        },
        {
          id: "A005",
          title: "Sesi Diskusi Publik 'Masa Depan Kota'",
          date: "05 Mei 2025",
          location: "Area Komunitas",
          category: "Acara Publik",
          summary:
            "Sesi terbuka dengan masyarakat untuk menampung masukan terkait rencana tata ruang kota 5 tahun ke depan.",
          imageUrl:
            "https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=600&auto=format&fit=crop",
          detailUrl: "#detail-A005",
          progress: 60 // Realisasi Fisik
        },
        {
          id: "A006",
          title: "Simulasi Tanggap Bencana Infrastruktur",
          date: "01 April 2025",
          location: "Area Simulasi",
          category: "Simulasi",
          summary:
            "Latihan kesiapan tim tanggap darurat dalam menangani kerusakan infrastruktur akibat bencana alam.",
          imageUrl:
            "https://images.unsplash.com/photo-1533038590840-cd4739265882?q=80&w=600&auto=format&fit=crop",
          detailUrl: "#detail-A006",
          progress: 50 // Realisasi Fisik
        }
      ];

      // --- UTILITAS ---

      function getCategoryColor(category) {
        switch (category) {
          case "Inaugurasi": return "bg-green-100 text-green-700";
          case "Rapat Internal": return "bg-indigo-100 text-indigo-700";
          case "Kunjungan": return "bg-yellow-100 text-yellow-700";
          case "Pelatihan": return "bg-teal-100 text-teal-700";
          case "Acara Publik": return "bg-pink-100 text-pink-700";
          case "Simulasi": return "bg-red-100 text-red-700";
          default: return "bg-gray-100 text-gray-700";
        }
      }

      function renderIcons() {
        setTimeout(() => {
          if (typeof lucide !== "undefined" && lucide.createIcons) {
            lucide.createIcons();
          }
        }, 0);
      }

      // --- RENDERING UI ---

      function renderActivitiesGrid() {
        const container = document.getElementById("activities-grid");
        container.innerHTML = ""; 

        ACTIVITY_DATA.forEach((activity, index) => {
          const categoryClass = getCategoryColor(activity.category);
          const delay = index * 100; // Animasi delay
          
          // Pastikan progress adalah angka dan dibatasi antara 0 hingga 100
          const progressValue = Math.min(100, Math.max(0, activity.progress || 0));

          const cardHtml = `
            <!-- Kartu Kegiatan: Dibuat sebagai tautan (<a>) agar keseluruhan kartu bisa diklik. -->
            <a href="${activity.detailUrl}" class="activity-card bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100 block group" style="animation-delay: ${delay}ms">
                
                <!-- Image Header -->
                <div class="image-container relative">
                    <img 
                        src="${activity.imageUrl}" 
                        alt="${activity.title}" 
                        class="image-placeholder"
                        loading="lazy"
                        onerror="this.onerror=null; this.src='https://placehold.co/600x200/cccccc/333333?text=Foto+Kegiatan';"
                    >
                    <div class="absolute top-3 left-3">
                         <span class="text-xs font-bold px-3 py-1 rounded-full ${categoryClass} shadow-sm backdrop-blur-sm bg-opacity-90">
                            ${activity.category}
                        </span>
                    </div>
                </div>

                <div class="p-5 flex flex-col">
                    <h3 class="text-xl font-semibold text-primary mb-3 line-clamp-2 group-hover:text-accent transition-colors">
                        ${activity.title}
                    </h3>
                    
                    <!-- Metadata -->
                    <div class="flex flex-wrap items-center space-x-4 text-sm text-secondary mb-4">
                        <div class="flex items-center mb-1">
                            <i data-lucide="calendar" class="w-4 h-4 mr-1.5 text-accent"></i>
                            ${activity.date}
                        </div>
                        <div class="flex items-center mb-1">
                            <i data-lucide="map-pin" class="w-4 h-4 mr-1.5 text-accent"></i>
                            ${activity.location}
                        </div>
                    </div>

                    <p class="text-sm text-gray-500 mb-2 line-clamp-3">
                        ${activity.summary}
                    </p>
                    
                    <!-- Realisasi Fisik (Progress Bar) - Menggantikan "Lihat Detail" -->
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-medium text-primary">Realisasi Fisik:</span>
                            <span class="text-sm font-bold progress-text">${progressValue}%</span>
                        </div>
                        
                        <!-- Progress Bar Container -->
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <!-- Progress Fill -->
                            <div 
                                class="progress-bar-fill h-2.5 rounded-full transition-all duration-500 ease-out" 
                                style="width: ${progressValue}%"
                            ></div>
                        </div>
                    </div>

                </div>
            </a>
          `;
          container.insertAdjacentHTML("beforeend", cardHtml);
        });

        renderIcons();
      }

      window.onload = function () {
        renderActivitiesGrid();
      };
    </script>
  </body>
</html>
